[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-prisma"
description = "Prisma grammar for tree-sitter"
version = "0.2.0"
keywords = ["incremental", "parsing", "tree-sitter", "prisma"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Joohwan Oh", email = "joohwan.oh@outlook.com" }]
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.16.0"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/joowani/tree-sitter-prisma"

[project.optional-dependencies]
core = ["tree-sitter>=0.26.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
