name: publish

run-name: Publish v${{ github.event.client_payload.version }}

on:
  # Send event_type=publish with client_payload.version through the repository dispatch API.
  repository_dispatch:
    types: [publish]

concurrency:
  group: publish-${{ github.event.client_payload.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.client_payload.version }}

jobs:
  # Version tags are immutable, including versions consumed through Go or Swift before a crate is published.
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Validate release source and version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
              echo "release resolved to $GITHUB_REF instead of $expected_ref" >&2
              exit 1
          fi
          if [[ ! $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "version $VERSION is not a bare x.y.z number" >&2
              exit 1
          fi

      - name: Choose the commit to release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Any answer other than found or missing stops the release, since guessing wrong could mix two commits.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent "tree-sitter-prisma release workflow (https://github.com/$GH_REPO)" \
              "https://crates.io/api/v1/crates/tree-sitter-prisma/$VERSION")"
          case "$status" in
              200) published=true ;;
              404) published=false ;;
              *) echo "crates.io answered $status while checking tree-sitter-prisma $VERSION" >&2; exit 1 ;;
          esac

          if tag_ref_response="$(gh api --include "repos/$GH_REPO/git/ref/tags/v$VERSION" 2>&1)"; then
              tag_commit="$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)"
          elif grep -qE '^HTTP/[0-9.]+ 404 ' <<<"$tag_ref_response"; then
              tag_commit=""
          else
              echo "GitHub could not confirm whether tag v$VERSION exists" >&2
              printf '%s\n' "$tag_ref_response" >&2
              exit 1
          fi

          if [[ -z "$tag_commit" ]]; then
              if [[ "$published" == true ]]; then
                  echo "tree-sitter-prisma $VERSION is published but has no source tag; refusing to guess its commit" >&2
                  exit 1
              fi
              echo "tagging $GITHUB_SHA as v$VERSION"
              { echo "sha=$GITHUB_SHA"; echo "tag=create"; } >> "$GITHUB_OUTPUT"
          else
              echo "::notice::v$VERSION already tags $tag_commit; reusing that source for this release"
              { echo "sha=$tag_commit"; echo "tag=keep"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}

      - name: Validate version
        run: scripts/publish --check "$VERSION"

  check:
    name: Check
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  tag:
    name: Tag Release
    needs: [validate, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the checked commit
        if: needs.validate.outputs.tag == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT" >/dev/null

  publish-crate:
    name: Publish Crate
    needs: [validate, tag]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish "$VERSION"

  publish-release:
    name: Publish GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! is_draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
              gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          elif [[ "$is_draft" == true ]]; then
              gh release edit "v$VERSION" --draft=false
          else
              echo "release v$VERSION is already published; nothing to do"
          fi
