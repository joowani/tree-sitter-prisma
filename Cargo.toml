[package]
name = "tree-sitter-prisma"
description = "Prisma grammar for tree-sitter"
version = "0.2.2"
authors = ["Joohwan Oh <joohwan.oh@outlook.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "prisma"]
categories = ["parser-implementations", "parsing", "text-editors"]
homepage = "https://github.com/joowani/tree-sitter-prisma"
repository = "https://github.com/joowani/tree-sitter-prisma"
edition = "2024"
rust-version = "1.90"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/**/*.c",
  "/src/**/*.h",
  "/src/**/*.json",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
